name: Build Windows portable release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.txt -r requirements-build.txt

      - name: Build portable bundle
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCRProxyDesktop-win-x64-portable
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create $env:GITHUB_REF_NAME release/*.zip release/*.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
